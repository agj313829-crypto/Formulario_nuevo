<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>Formulario de contacto</h1>


  <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="email">Apellido :</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="mensaje">Tipo de identificacion :</label><br>
    <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>

    <label for="identificacion">Tipo de identificación:</label>
    <select name="Tipo de identificación" id="identificacion" required>
      <option value="">Seleccione una opción</option>
      <option value="CC">Cédula de Ciudadanía (CC)</option>
      <option value="TI">Tarjeta de Identidad (TI)</option>
      <option value="RC">Registro Civil (RC)</option>
      <option value="PA">Pasaporte (PA) </option>
    </select><br><br>

    <label for="numero de identificacion">Número de identificación:</label>
    <input type="text" id="numero de identificacion" name="identificacion" required><br><br>

    <label for="fecha de nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha de nacimiento" name="fecha de nacimiento" required><br><br>

    <label for="celular">Número de celular:</label>
    <input type="text" id="celular" name="celular" required><br><br>

    <label for="ciudad">Ciudad:</label><br>
    <select id="ciudad" name="ciudad" required>
      <option value="">Seleccione una opción</option>
      <option value="Bogotá">Bogotá</option>
      <option value="Medellín">Medellín</option>
      <option value="Cali">Cali</option>
      <option value="Barranquilla">Barranquilla</option>
      <option value="Cartagena">Cartagena</option>
      <option value="Cúcuta">Cúcuta</option>
      <option value="Bucaramanga">Bucaramanga</option>
      <option value="Pereira">Pereira</option>
      <option value="Santa Marta">Santa Marta</option>
      <option value="Ibagué">Ibagué</option>
      <option value="Manizales">Manizales</option>
      <option value="Villavicencio">Villavicencio</option>
      <option value="Neiva">Neiva</option>
      <option value="Pasto">Pasto</option>
      <option value="Armenia">Armenia</option>
      <option value="Popayán">Popayán</option>
      <option value="Sincelejo">Sincelejo</option>
      <option value="Valledupar">Valledupar</option>
      <option value="Montería">Montería</option>
      <option value="Tunja">Tunja</option>
    </select><br><br>

    <input type="checkbox" id="terminos" name="terminos" required>
    <label for="terminos">Acepto los términos y condiciones</label><br><br>

    <input type="submit" value="Enviar">
  </form>
</body>
</html>
